<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Cronograma de limpieza del Grupo 5: turnos, capitanes y voluntarios asignados.">
  <title>Cronograma de Limpieza - Grupo 5</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="modulepreload" href="js/db.js">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><svg class="i" aria-hidden="true"><use href="#i-broom"/></svg> Cronograma de Limpieza</h1>
      <p class="subtitle">Grupo 5 • Organización y Turnos</p>
    </header>

    <section class="toolbar" aria-label="Filtros">
      <label class="field">
        <span>Semana</span>
        <select id="week-select">
          <option value="proximas">Próximas semanas</option>
          <option value="all">Todas las semanas</option>
        </select>
      </label>
      <label class="field">
        <span>¿Cuándo me toca?</span>
        <input id="search" type="search" placeholder="Escribe tu nombre…" autocomplete="off">
      </label>
      <button id="toggle-all" class="btn-secondary" type="button">Ver todos los nombres</button>
    </section>

    <p id="search-result" class="search-result" hidden></p>

    <main class="schedule-grid" id="schedule-container" aria-live="polite">
      <div class="skeleton"></div><div class="skeleton"></div>
    </main>

    <footer>
      <a href="admin.html" class="admin-link"><svg class="i" aria-hidden="true"><use href="#i-lock"/></svg> Acceso administrador</a>
    </footer>
  </div>

  <script type="module" src="js/user.js"></script>
</body>
</html>
